    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

      --color-muted: #a7ada5; --color-accent: #d7ff4f;
      --font-sans: 'Khand', 'Arial Narrow', sans-serif; --font-display: 'Array', 'Arial Black', sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 880px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.01em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
