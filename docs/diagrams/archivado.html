<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivado exactamente una vez</title>
  <link href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #080909; --color-ink: #f2f1e9;
      --color-muted: #a7ada5; --color-accent: #d7ff4f;
      --font-sans: 'Khand', 'Arial Narrow', sans-serif;
      --font-display: 'Array', 'Arial Black', sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.01em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Secuencia · workflow.camir.tech</p>
    <h1>Dos personas terminan a la vez, y la tarea se archiva una sola</h1>
    <svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-seq-title workflow-seq-desc">

      <desc id="workflow-seq-desc">Dos personas completan la última parte de la misma tarea en el mismo instante y sus peticiones caen en réplicas distintas de la API. Un lock de fila sobre la tarea serializa ambas transacciones: la primera actualiza su parte y encuentra que todavía queda alguien pendiente, la segunda encuentra que no queda nadie y es la única que consigue archivar. La fila que devuelve ese UPDATE es lo que autoriza a enviar la notificación, una sola vez.</desc>

      <text x="566" y="366" fill="#f2f1e9" font-size="14" font-style="italic" font-family="'Khand', 'Arial Narrow', sans-serif">B espera aquí.</text>
      <text x="566" y="382" fill="#a7ada5" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">El lock de fila serializa ambas completions;</text>
      <text x="566" y="394" fill="#a7ada5" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">sin él, ninguna de las dos archivaría.</text>
