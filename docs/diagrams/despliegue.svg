<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-deploy-title workflow-deploy-desc">
      <title id="workflow-deploy-title">Dónde corre la API</title>
      <desc id="workflow-deploy-desc">Tres fronteras de red: internet, la red del homelab sobre Proxmox y la red de pods de Kubernetes. Una petición entra por el puerto 443 al host, que la redirige por DNAT al Gateway del cluster, y de ahí a dos réplicas de la aplicación. Cuando esas réplicas salen hacia PostgreSQL en data-01 cruzan de vuelta a la red del homelab y Cilium reescribe la dirección de origen, que es la razón por la que las reglas del firewall nombran a los nodos y no al rango de pods.</desc>
