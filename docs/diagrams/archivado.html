<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivado exactamente una vez</title>
  <link href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #080909; --color-ink: #f2f1e9;
      --color-muted: #a7ada5; --color-accent: #d7ff4f;
      --font-sans: 'Khand', 'Arial Narrow', sans-serif; --font-display: 'Array', 'Arial Black', sans-serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-display); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.01em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Secuencia · workflow.camir.tech</p>
    <h1>Terminan a la vez, se archiva una sola</h1>
    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-seq-title workflow-seq-desc">
      <title id="workflow-seq-title">Archivado exactamente una vez</title>
      <desc id="workflow-seq-desc">Dos personas completan la última parte de la misma tarea en el mismo instante, y sus peticiones caen en réplicas distintas. Un lock de fila sobre la tarea pone las dos transacciones en orden: la primera todavía encuentra a alguien pendiente, la segunda ya no encuentra a nadie y es la única que consigue archivar. La fila que devuelve ese UPDATE es lo que autoriza a enviar la notificación.</desc>

        <marker id="arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#ff766c"/></marker>
        <marker id="arrow-open" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polyline points="0 0, 9 3.5, 0 7" fill="none" stroke="#a7ada5" stroke-width="1.4"/></marker>
      </defs>

      <rect x="751" y="498" width="158" height="16" rx="2" fill="#080909"/>
      <text x="830" y="510" fill="#a7ada5" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.03em">una sola notificación</text>
    </svg>
  </div>
</body>
</html>
